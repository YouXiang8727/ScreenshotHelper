name: Android Build & Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ScreenshotHelper.apk

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        body: "这是最新的编译版本。每次推送到 master 分支时都会自动更新此文件。"
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/ScreenshotHelper.apk
        fail_on_unmatched_files: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
